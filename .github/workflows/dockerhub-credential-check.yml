name: Docker Hub credential check

# Catches an expired/revoked DOCKERHUB_TOKEN *before* a push to master hits
# CI: scheduled runs happen regardless of push activity, whereas the failure
# they predict would otherwise only surface at "Initialize containers" of the
# first post-expiry push. A red run here emails repo watchers (GitHub's
# default Actions failure notification) — the distinct early warning.
on:
  schedule:
    - cron: "43 5 * * *" # daily, 05:43 UTC
  workflow_dispatch: {} # manual trigger, also used to verify this workflow

permissions:
  contents: read

jobs:
  check:
    name: Docker Hub credentials usable
    runs-on: ubuntu-latest
    steps:
      - name: Mint a registry pull token (credential values never printed)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are missing — service containers and BuildKit pulls cannot authenticate."
            exit 1
          fi
          # Ask Docker Hub's registry auth endpoint for a pull token scoped to
          # the exact image CI uses. Credentials are fed to curl via stdin
          # config so they never appear in the process list, and the response
          # body (which contains the minted token) goes to a temp file that is
          # deleted without ever being printed. Only the HTTP status is used.
          tmp="$(mktemp)"
          code="$(
            printf 'user = "%s:%s"\n' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" |
              curl -sS -K - -o "${tmp}" -w '%{http_code}' \
                'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull'
          )"
          rm -f "${tmp}"
          case "${code}" in
            200)
              echo "Docker Hub credentials valid — pull token minted (HTTP 200)."
              ;;
            401 | 403)
              echo "::error::Docker Hub rejected DOCKERHUB_TOKEN (HTTP ${code}) — expired or revoked. Rotate the token in Docker Hub and update the repo secret before the next push to master."
              exit 1
              ;;
            *)
              echo "::error::Unexpected response from auth.docker.io (HTTP ${code}) — credentials unverified. Re-run before trusting this result."
              exit 1
              ;;
          esac
