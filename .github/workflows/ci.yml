name: FarmOps CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: "20"
  # pnpm version comes from the "packageManager" field in package.json —
  # one source of truth for local, CI and Docker (roadmap Phase 3).
  TEST_DATABASE_URL: "postgresql://farmops:farmops123@localhost:5432/farmops_test"

jobs:
  # ─── Lint & Type Check ──────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm eslint . --max-warnings 10

  # ─── Strict type-coverage floor (package.json typeCoverage) ──
  typecov:
    name: Type Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Type coverage >= 99% (strict, excludes generated .next)
        run: pnpm exec type-coverage

  # ─── Unit + PostgreSQL integration tests ────────────
  test:
    name: Tests (unit + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: farmops_test
          POSTGRES_USER: farmops
          POSTGRES_PASSWORD: farmops123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      # Phase 3 drift gate: after a fresh `migrate deploy`, the database must
      # match schema.prisma exactly. Fails CI when someone edits the schema
      # without a versioned migration (the db push failure mode).
      - name: Verify migrations match schema (no drift)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Run Tests (includes real-PostgreSQL concurrency suite)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DB_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm vitest run --reporter=verbose

  # ─── Build ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build Next.js
        run: pnpm next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ─── E2E (incl. tenant-isolation suite) ─────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: farmops_test
          POSTGRES_USER: farmops
          POSTGRES_PASSWORD: farmops123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Database (versioned migrations + seed)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # Seed refuses to run without admin credentials; these are CI-only,
          # throwaway values that exist for as long as the job's container.
          ADMIN_EMAIL: "farmops-ci-admin@example.test"
          ADMIN_NAME: "CI Admin"
          ADMIN_PASSWORD: "ci-only-password-123"
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      - name: Run E2E Tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NEXTAUTH_SECRET: "test-secret"
          NEXTAUTH_URL: "http://localhost:3000"
        run: |
          pnpm dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          pnpm exec playwright test

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Docker build + runtime smoke test ──────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: farmops_test
          POSTGRES_USER: farmops
          POSTGRES_PASSWORD: farmops123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: farmops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare database for the container
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Start container
        run: |
          docker run -d --name farmops-app -p 3000:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL="postgresql://farmops:farmops123@host.docker.internal:5432/farmops_test" \
            -e NEXTAUTH_SECRET="docker-smoke-test-secret" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            farmops:latest

      - name: Runtime smoke test
        run: |
          set -euo pipefail
          echo "Waiting for readiness..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||!h.checks||h.checks.database.status!=='up'){console.error('health check degraded');process.exit(1);}"
          # Authentication boundary: protected routes reject anonymous callers
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/farms)
          test "$code" = "401" || { echo "expected 401 from /api/farms, got $code"; exit 1; }
          # Representative public API call + page render
          curl -fsS http://localhost:3000/api/auth/csrf > /dev/null
          curl -fsS http://localhost:3000/login | grep -qi "FarmOps"
          echo "Docker runtime smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: docker logs farmops-app
